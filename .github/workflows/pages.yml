# Compila el sitio Astro y lo publica en GitHub Pages.
# IMPORTANTE: el deploy solo funciona cuando Settings -> Pages -> Source = "GitHub Actions".
# Mientras Pages siga en "Deploy from a branch", el build corre pero el deploy falla y el sitio vivo (index.html) no cambia
# (también falla en cada actualización de fixtures.json de la raíz que haga Kody, hasta activar Pages).
name: Publicar página (Astro)

on:
  # Se dispara cuando cambia el sitio o los datos: `fixtures.json` (raíz, lo escribe Kody mientras no migre) o
  # `src/data/fixtures.json` (cae en src/**, lo escribe Kody una vez migrado). `index.html` de la raíz NO lo dispara.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'fixtures.json'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - 'tsconfig.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Usa los datos más recientes entre fixtures.json (raíz) y src/data/fixtures.json (ver el script).
      - run: node scripts/pick-data.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
