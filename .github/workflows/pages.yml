# Compila el sitio Astro y lo publica en GitHub Pages.
# IMPORTANTE: el deploy solo funciona cuando Settings -> Pages -> Source = "GitHub Actions".
# Mientras Pages siga en "Deploy from a branch", el build corre pero el deploy falla y el sitio vivo (index.html) no cambia.
name: Publicar página (Astro)

on:
  # Solo cuando cambia el sitio: los commits del job de Kody a index.html / fixtures.json (raíz) NO lo disparan.
  # Cuando Kody pase a escribir src/data/fixtures.json, cada actualización del fixture sí lo dispara (cae en src/**).
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - 'tsconfig.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
